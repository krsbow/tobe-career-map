<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Navy rounded background badge -->
  <rect width="64" height="64" rx="16" fill="#243760" />
  
  <!-- Sleek Modern Glasses / Spectacles Frame -->
  <!-- Left Lens -->
  <circle cx="20" cy="34" r="9.5" fill="none" stroke="#F9F8F5" stroke-width="3" />
  <circle cx="20" cy="34" r="6.5" fill="#7A9E8E" fill-opacity="0.35" />
  <!-- Left Lens Glare reflection -->
  <path d="M 16 29 A 6 6 0 0 1 23 29" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />
  
  <!-- Right Lens -->
  <circle cx="44" cy="34" r="9.5" fill="none" stroke="#F9F8F5" stroke-width="3" />
  <circle cx="44" cy="34" r="6.5" fill="#7A9E8E" fill-opacity="0.35" />
  <!-- Right Lens Glare reflection -->
  <path d="M 40 29 A 6 6 0 0 1 47 29" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.7" />
  
  <!-- Symmetrical Nose Bridge connecting inner edges -->
  <path d="M 29.5 33 C 30.7 30.5, 33.3 30.5, 34.5 33" fill="none" stroke="#F9F8F5" stroke-width="3" stroke-linecap="round" />

  <!-- Left Temple frame arm -->
  <path d="M 10.5 33 L 4 30" fill="none" stroke="#F9F8F5" stroke-width="3" stroke-linecap="round" />

  <!-- Right Temple frame arm -->
  <path d="M 53.5 33 L 60 30" fill="none" stroke="#F9F8F5" stroke-width="3" stroke-linecap="round" />

  <!-- Minimal Discovery Star / Vision Spark at top right -->
  <path d="M 50 13 L 51.2 16.8 L 55 18 L 51.2 19.2 L 50 23 L 48.8 19.2 L 45 18 L 48.8 16.8 Z" fill="#7A9E8E" />
</svg>
